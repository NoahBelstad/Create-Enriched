name: Run Automated Mod Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - 'release/**'
      - '1.21.1'
  push:
    branches:
      - dev
      - 'release/**'
      - '1.21.1'

jobs:
  test:
    name: Run Unit Tests & GameTest Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run JUnit Unit Tests
        run: ./gradlew test --stacktrace

      - name: Run NeoForge GameTest Server
        run: ./gradlew runGameTestServer --stacktrace -Djava.awt.headless=true
