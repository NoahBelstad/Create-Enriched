name: Core Feature Task
description: Internal task template for core developers only.
title: "feat(core): "
labels: ["core-dev-only", "status: approved"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ### 🔒 Core Development Task
        This task is reserved strictly for lead architecture and core development.
  
  - type: textarea
    id: summary
    attributes:
      label: Technical Summary
      description: High-level overview of the feature or architectural change.
      placeholder: Describe the technical implementation details...
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Acceptance Criteria
      options:
        - label: Implementation complete
        - label: Unit / Integration tests passing
        - label: Documentation / Specs updated

