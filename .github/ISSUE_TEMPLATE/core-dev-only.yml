name: Core Feature Task
description: Internal task template for core developers only.
title: "feat(core): "
labels: ["core-dev-only", "status: approved"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ### 🔒 Core Development Task
        This task is reserved strictly for lead architecture and core development.
  
  - type: textarea
    id: summary
    attributes:
      label: Technical Summary
      description: High-level overview of the feature or architectural change.
      placeholder: Describe the technical implementation details...
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Functional Requirements
      description: What specific behavior or capabilities must this core feature provide?
      placeholder: "- Feature must...\n- API should expose..."
    validations:
      required: true

  - type: checkboxes
    id: task_scope
    attributes:
      label: Scope Verification
      options:
        - label: Ready for implementation
        - label: Core architecture impact reviewed
