name: Feature Request
description: Suggest an idea or feature enhancement for this project.
title: "feat: "
labels: ["enhancement", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ### 🚀 Feature Request
        Have an idea to make this project better? We'd love to hear it!

  - type: textarea
    id: problem_statement
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear description of what you want to happen.
      placeholder: I would like the app to allow...
    validations:
      required: true

  - type: textarea
    id: alternatives_considered
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or features you've evaluated.
      placeholder: I tried doing X, but it didn't work because...
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here.
      placeholder: Additional context or links...
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have checked existing feature requests to make sure this isn't a duplicate.
