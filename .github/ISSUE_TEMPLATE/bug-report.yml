name: Bug Report
description: Create a report to help us improve and fix issues.
title: "bug: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ### 🐛 Bug Report
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it.

  - type: textarea
    id: bug_summary
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Explain step-by-step how to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
      placeholder: I expected X to happen, but instead Y happened...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: System information (OS, browser, version, etc.).
      placeholder: |
        - OS: [e.g. macOS, Windows, Ubuntu]
        - Version: [e.g. v1.2.3]
        - Browser / Node version: [if applicable]
    validations:
      required: false

  - type: textarea
    id: logs_or_screenshots
    attributes:
      label: Screenshots or Error Logs
      description: Add any relevant log outputs or screenshots to help explain your problem.
      placeholder: Paste error logs or drag images here...
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to ensure this bug hasn't already been reported.
        - label: I am using the latest version of the project.
